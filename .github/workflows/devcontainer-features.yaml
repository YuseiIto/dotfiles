name: Dev Container Features

on:
  push:
    branches:
      - main
    paths:
      - devcontainer-features/**
      - .github/workflows/devcontainer-features.yaml
  pull_request:
    paths:
      - devcontainer-features/**
      - .github/workflows/devcontainer-features.yaml
      - scripts/check-feature-versions*

# NOTE: A push gets its own group because the version check covers only that
# push's range; a cancelled or replaced run would leave its range unchecked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Version bump 🔖
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The check diffs against the merge base with BASE_REF.
          fetch-depth: 0
      - name: Test the check
        run: make test-feature-versions
      - name: Check changed features bump their version
        env:
          # NOTE: A pull request is checked against the target branch as of the
          # event, so two pull requests can each pass with the same new version.
          # Checking each push to main against the previous tip fails the run of
          # the one merged second. That is only a signal: publish does not wait
          # for this job and skips the reused version.
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: make check-feature-versions

  test:
    name: Test 🧪 [${{ matrix.feature }}]
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        feature: [agent-sandbox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run feature tests
        run: |
          npx --yes @devcontainers/cli@0.89.0 features test \
            -p devcontainer-features -f "${{ matrix.feature }}" --skip-autogenerated

  publish:
    name: Publish 📦
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # NOTE: Serializes publishing across pushes. The job queued last replaces the
    # pending one, and queue order follows test completion, not push order. An
    # older push can thus replace a newer one and leave its bump unpublished
    # until the next feature change; rerun the publish job of the latest main run
    # to recover.
    concurrency:
      group: ${{ github.workflow }}-publish
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Publish features
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          publish-features: 'true'
          base-path-to-features: ./devcontainer-features/src
          disable-repo-tagging: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
