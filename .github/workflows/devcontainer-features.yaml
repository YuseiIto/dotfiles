name: Dev Container Features

on:
  push:
    branches:
      - main
    paths:
      - devcontainer-features/**
      - .github/workflows/devcontainer-features.yaml
  pull_request:
    paths:
      - devcontainer-features/**
      - .github/workflows/devcontainer-features.yaml
      - scripts/check-feature-versions*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Version bump 🔖
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The check diffs against the merge base with the target branch.
          fetch-depth: 0
      - name: Test the check
        run: scripts/check-feature-versions.test.sh
      - name: Check changed features bump their version
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: scripts/check-feature-versions.sh "$BASE_REF"

  test:
    name: Test 🧪 [${{ matrix.feature }}]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        feature: [agent-sandbox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run feature tests
        run: |
          npx --yes @devcontainers/cli@0.89.0 features test \
            -p devcontainer-features -f "${{ matrix.feature }}" --skip-autogenerated

  publish:
    name: Publish 📦
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Publish features
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          publish-features: 'true'
          base-path-to-features: ./devcontainer-features/src
          disable-repo-tagging: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
