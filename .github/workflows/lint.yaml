name: Lint
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          bundler-cache: true
          working-directory: mitamae
      - name: Run RuboCop
        run: bundle exec rubocop
        working-directory: mitamae

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Use the Makefile target as the single source of truth so local
      # `make shellcheck` and CI always lint the same set of files.
      # shellcheck is preinstalled on GitHub-hosted ubuntu runners.
      - name: Run ShellCheck
        run: make shellcheck

  role-variant:
    name: Role variant matches role name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check that each role's variant equals its directory name
        run: make check-role-variants

  version-pins:
    name: Version pins are tracked by Renovate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check that each cookbook version pin has a Renovate annotation
        run: make check-version-pins
