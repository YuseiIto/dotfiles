name: Lint
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          bundler-cache: true
          working-directory: mitamae
      - name: Run RuboCop
        run: bundle exec rubocop
        working-directory: mitamae

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Use the Makefile target as the single source of truth so local
      # `make shellcheck` and CI always lint the same set of files.
      # shellcheck is preinstalled on GitHub-hosted ubuntu runners.
      - name: Run ShellCheck
        run: make shellcheck

  role-variant:
    name: Role variant matches role name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check that each role's variant equals its directory name
        run: make check-role-variants

  version-pins:
    name: Version pins are tracked by Renovate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check that each cookbook version pin has a Renovate annotation
        run: make check-version-pins

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The official image bundles shellcheck, which actionlint uses to lint
      # `run:` scripts, and is pinned by digest so Renovate can update it.
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          # Report through annotations and a failing job instead of uploading
          # SARIF, which would need security-events: write.
          advanced-security: false
          annotations: true
          # NOTE: online audits (e.g. known-vulnerable-actions) are off to keep
          # the result reproducible with `make zizmor`, which runs offline.
          online-audits: false
