command:
  claude --version:
    exit-status: 0
    timeout: 30000
  CLAUDE_CONFIG_DIR=/tmp/claude-link-test claude-dotfiles-link && test -L /tmp/claude-link-test/settings.json && test -L /tmp/claude-link-test/rules:
    exit-status: 0
file:
  "{{.Env.HOME}}/.claude/settings.json":
    exists: true
    filetype: symlink
  "{{.Env.HOME}}/.claude/statusline-command.sh":
    exists: true
    filetype: symlink
  "{{.Env.HOME}}/.claude/claude-tmux-notify":
    exists: true
    filetype: symlink
  "{{.Env.HOME}}/.claude/CLAUDE.md":
    exists: true
    filetype: symlink
  "{{.Env.HOME}}/.claude/rules":
    exists: true
    filetype: symlink
  "{{.Env.HOME}}/.local/bin/claude-dotfiles-link":
    exists: true
    filetype: symlink
